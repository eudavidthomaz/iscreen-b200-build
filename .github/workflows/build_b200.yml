name: Build iScreen B200 firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar repo tool
        run: |
          sudo mkdir -p /usr/local/bin
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
          sudo chmod +x /usr/local/bin/repo

      - name: Configurar git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Repo init + sync (baixa todos os componentes)
        run: |
          mkdir -p b200 && cd b200
          repo init -u https://github.com/Data-Frog-Central/NocturnalRTOS-Manifest
          repo sync -c --no-clone-bundle --optimized-fetch --prune -j$(nproc)

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y \
            wget git gcc flex bison gperf make unzip zip dos2unix swig \
            python3-dev python3-pip python3-setuptools python3-wheel \
            ninja-build rename gdb re2c universal-ctags lzip libncurses-dev \
            tree pkg-config cmake automake lzop doxygen graphviz \
            libssl-dev genromfs lzma mtools mtd-tools rsync
          sudo pip3 install pylibfdt --break-system-packages || true

      - name: Instalar toolchain MIPS
        run: |
          cd b200
          ./scripts/install-toolchain.sh

      - name: Compilar B200 (media_cast = hccast AirPlay/Miracast/DLNA)
        run: |
          cd b200
          sed -i 's|BR2_TARGET_CROSS=.*|BR2_TARGET_CROSS="/opt/frog-toolchain/mipsel-mti-elf_stable/bin/mipsel-mti-elf-"|' configs/hichip_hc15xx_db_b200_v22_media_cast_defconfig
          grep BR2_TARGET_CROSS configs/hichip_hc15xx_db_b200_v22_media_cast_defconfig
          make -f Makefile.common hichip_hc15xx_db_b200_v22_media_cast_defconfig
          make -f Makefile.common all

      - name: Listar firmware gerado
        run: |
          cd b200
          echo "=== .asd gerados ==="
          find . -name "*.asd" -exec ls -la {} \;
          echo "=== imagens ==="
          ls -la output/images/ 2>/dev/null | head -40

      - name: Gerar pacote de upgrade (HCFOTA)
        run: |
          cd b200
          ASD=$(find . -name "*.asd" | head -1)
          if [ -n "$ASD" ]; then
            cp "$ASD" HCFOTA_HC15B200_hcscreen_rtos_prototype.bin
            echo "Pacote gerado: HCFOTA_HC15B200_hcscreen_rtos_prototype.bin"
            ls -la HCFOTA_*.bin
          fi

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: iscreen-b200-firmware
          path: |
            b200/**/*.asd
            b200/HCFOTA_*.bin
          if-no-files-found: warn
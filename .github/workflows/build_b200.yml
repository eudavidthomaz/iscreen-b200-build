name: Build iScreen B200 firmware (4MB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar repo tool
        run: |
          sudo mkdir -p /usr/local/bin
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
          sudo chmod +x /usr/local/bin/repo

      - name: Configurar git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Repo init + sync (baixa todos os componentes)
        run: |
          mkdir -p b200 && cd b200
          repo init -u https://github.com/Data-Frog-Central/NocturnalRTOS-Manifest
          repo sync -c --no-clone-bundle --optimized-fetch --prune -j$(nproc)

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y \
            wget git gcc flex bison gperf make unzip zip dos2unix swig \
            python3-dev python3-pip python3-setuptools python3-wheel \
            ninja-build rename gdb re2c universal-ctags lzip libncurses-dev \
            tree pkg-config cmake automake lzop doxygen graphviz \
            libssl-dev genromfs lzma mtools mtd-tools rsync
          sudo /usr/bin/python3 -m pip install fdt --break-system-packages
          /usr/bin/python3 -c "import fdt"

      - name: Instalar toolchain MIPS
        run: |
          cd b200
          ./scripts/install-toolchain.sh

      - name: Compilar B200 4MB (hcdemo + LZMA)
        run: |
          cd b200
          CFG=configs/hichip_hc15xx_db_b200_v10_hcdemo_defconfig
          DTS=board/hc15xx/common/dts/hc15xx-db-b200.dts
          sed -i 's|BR2_TARGET_CROSS=.*|BR2_TARGET_CROSS="/opt/frog-toolchain/mipsel-mti-elf_stable/bin/mipsel-mti-elf-"|' $CFG
          # GCC 14+ promove estes avisos a erro; o código legado (GCC 2019) os aceitava.
          sed -i 's|BR2_TARGET_CFLAGS="|BR2_TARGET_CFLAGS="-std=gnu99 -fcommon -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=implicit-int -Wno-error=return-mismatch -Wno-error=declaration-missing-parameter-type -Wno-error=builtin-declaration-mismatch |' $CFG
          # binutils 2.47 rejeita "-Os" no ld (lia como -O s).
          sed -i 's|BR2_TARGET_LDFLAGS="-g -EL -Os --static"|BR2_TARGET_LDFLAGS="-g -EL --static"|' $CFG
          sed -i 's/-Werror/-Wno-error/g' build/Makefile.rules
          sed -i 's|BR2_PACKAGE_FFMPEG_EXTRACONF="|BR2_PACKAGE_FFMPEG_EXTRACONF="--disable-asm --disable-inline-asm --disable-mmi --disable-loongson2 --disable-loongson3 --disable-mipsfpu --disable-mips32r2 --disable-mips32r5 --disable-mips64r2 --disable-mips32r6 --disable-mips64r6 --disable-mipsdsp --disable-mipsdspr2 --disable-msa --disable-msa2 |' $CFG
          # show_stack() do kernel chama lcd_*() incondicionalmente; o defconfig não habilita o driver.
          echo 'CONFIG_DRV_LCD=y' >> $CFG
          grep -E '^BR2_TARGET_(CROSS|CFLAGS|LDFLAGS)|^BR2_PACKAGE_FFMPEG_EXTRACONF|^CONFIG_DRV_LCD=' $CFG
          # Tabela de partições real do B200 (4MB): boot 0x0 | eromfs 0xd000 | firmware 0x47000 | persistentmem 0x3e0000
          sed -i 's/part1-reg = <0x0 0x60000>/part1-reg = <0x0 0xd000>/' $DTS
          sed -i 's/part2-reg = <0x60000 0x20000>/part2-reg = <0xd000 0x3a000>/' $DTS
          sed -i 's/part3-reg = <0x80000 0x360000>/part3-reg = <0x47000 0x399000>/' $DTS
          grep -q 'part1-reg = <0x0 0xd000>' $DTS
          grep -q 'part2-reg = <0xd000 0x3a000>' $DTS
          grep -q 'part3-reg = <0x47000 0x399000>' $DTS
          grep -nE 'part[0-9]-reg' $DTS
          # O iScreen usa saída HDMI; o DTS do hcdemo liga o LCD rgb (inexistente no aparelho) e desliga o hdmi.
          sed -i '/^[[:space:]]*hdmi[[:space:]]*{/,/^[[:space:]]*};/ s/status = "disabled";/status = "okay";/' $DTS
          sed -i '/^[[:space:]]*rgb[[:space:]]*{/,/^[[:space:]]*};/ s/status = "okay";/status = "disabled";/' $DTS
          awk '/^[[:space:]]*hdmi[[:space:]]*\{/,/^[[:space:]]*\};/' $DTS | grep -q 'status = "okay"'
          awk '/^[[:space:]]*rgb[[:space:]]*\{/,/^[[:space:]]*\};/' $DTS | grep -q 'status = "disabled"'
          make -f Makefile.common hichip_hc15xx_db_b200_v10_hcdemo_defconfig
          grep -q '^CONFIG_DRV_LCD=y' output/.config
          make -f Makefile.common all

      - name: Listar firmware gerado
        run: |
          cd b200
          ls -la output/images/
          SIZE=$(stat -c %s output/images/hcdemo.uImage)
          echo "hcdemo.uImage: $SIZE bytes (limite da partição: 3772416)"
          test "$SIZE" -le 3772416
          /usr/bin/python3 - <<'PYEOF'
          import fdt
          d = fdt.parse_dtb(open('output/images/dtb.bin', 'rb').read())
          st = {n: d.get_node('/hcrtos/' + n).get_property('status').data[0] for n in ('hdmi', 'rgb')}
          print('dtb.bin:', st)
          assert st == {'hdmi': 'okay', 'rgb': 'disabled'}, st
          PYEOF

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: iscreen-b200-firmware-4mb
          path: |
            b200/output/images/hcdemo.uImage
            b200/output/images/romfs.img
            b200/output/images/persistentmem.bin
            b200/output/images/dtb.bin
          if-no-files-found: error